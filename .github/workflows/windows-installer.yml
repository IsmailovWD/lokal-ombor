name: Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-windows-installer:
    name: Build Windows x64 NSIS installer
    runs-on: windows-latest

    steps:
      - name: Repositoryni olish
        uses: actions/checkout@v7

      - name: Node.js 22 o'rnatish
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Dependencylarni o'rnatish
        run: npm ci

      - name: Kod sifatini tekshirish
        run: npm run lint

      - name: TypeScript tekshiruvi
        run: npm run typecheck

      - name: Testlarni ishga tushirish
        run: npm test

      - name: Windows x64 installer yaratish
        run: npm run package:win

      - name: NSIS installerni artifact sifatida yuklash
        uses: actions/upload-artifact@v4
        with:
          name: Obmor-windows-x64-installer-${{ github.sha }}
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
